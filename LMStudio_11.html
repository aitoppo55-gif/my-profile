<!DOCTYPE html>
<!-- 【この行は何?】 このファイルがHTMLという形式であることをブラウザに伝えています。触らなくてOKです。 -->
<html lang="ja">
<head>
  <!-- 【ここから head】 ページの「設定」を書く場所です。画面には表示されません。 -->
  <meta charset="UTF-8">
  <!-- 【文字化け防止】 日本語が正しく表示されるようにしています。 -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 【スマホ対応の大事な設定】 スマホの画面幅にぴったり合わせて表示させます。これがないとスマホで小さく表示されます。 -->

  <title>自己紹介</title>
  <!-- 【タブの名前】 ブラウザのタブに表示される文字です。好きな名前に変えてOKです。 -->

  <style>
    /* 【ここから CSS】 見た目(色・大きさ・並べ方)を決める部分です。 */

    /* ---------- 色の設定 ---------- */
    :root {
      /* 【色のまとめ置き場】 ここで色を決めておくと、下の方で何度も使い回せます。 */
      --bg: #f7fbf9;        /* ページ全体の背景色(明るいミントがかった白) */
      --ink: #1b2a2f;       /* 文字の色(黒に近い濃い青緑) */
      --accent: #2e7d6b;    /* アクセント色(落ち着いた緑) */
      --marker: #f6c85f;    /* 名前の下の蛍光ペン風ラインの色(黄色) */
      --paper: #ffffff;     /* 吹き出しなどの白い部分 */
    }

    /* ---------- ページ全体 ---------- */
    * {
      box-sizing: border-box;
      /* 【大きさの計算ルール】 余白を含めた大きさで計算するようにして、画面からはみ出すのを防ぎます。 */
    }

    body {
      margin: 0;                       /* ページ端の余計な隙間をなくす */
      background: var(--bg);           /* 上で決めた背景色を使う */
      color: var(--ink);               /* 上で決めた文字色を使う */
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      /* 【フォント指定】 Mac・Windowsそれぞれできれいに見える日本語フォントを順番に探して使います。 */
      line-height: 1.8;                /* 行の間隔。広めにして読みやすくする */
      font-size: 17px;                 /* 基本の文字の大きさ */
    }

    /* ---------- 中身を入れる箱 ---------- */
    .page {
      max-width: 560px;                /* 横幅の上限。パソコンで横に広がりすぎないようにする */
      margin: 0 auto;                  /* 左右の余白を自動にして、画面の真ん中に置く */
      padding: 56px 24px 72px;         /* 箱の内側の余白(上・左右・下) */
    }

    /* ---------- 名前の部分 ---------- */
    .name {
      font-size: clamp(2.4rem, 11vw, 3.6rem);
      /* 【画面幅に合わせて文字サイズを自動調整】 スマホでは小さめ、パソコンでは大きめになります。 */
      font-weight: 800;                /* 文字を太くする */
      line-height: 1.25;               /* 名前まわりの行間 */
      margin: 0 0 40px;                /* 下に余白をあける */
      display: inline;                 /* 蛍光ペンのラインを文字の幅だけに付けるための設定 */
      background: linear-gradient(transparent 62%, var(--marker) 62%);
      /* 【蛍光ペン風の下線】 文字の下の方だけ黄色く塗っています。 */
    }

    .name-wrap {
      margin: 0 0 40px;                /* 名前全体の下の余白 */
    }

    /* ---------- ひとこと挨拶(吹き出し) ---------- */
    .greeting {
      background: var(--paper);        /* 白い背景 */
      border-left: 6px solid var(--accent);   /* 左側に緑の太い線 */
      border-radius: 4px 14px 14px 4px;       /* 角の丸み(左は小さく、右は大きく) */
      padding: 20px 22px;              /* 吹き出しの内側の余白 */
      margin: 0 0 48px;                /* 下の余白 */
      font-size: 1.05rem;              /* 少しだけ大きい文字 */
    }

    /* ---------- 見出し(「趣味」の文字) ---------- */
    h2 {
      font-size: 1.2rem;               /* 見出しの大きさ */
      margin: 0 0 16px;                /* 下の余白 */
      color: var(--accent);            /* 緑色にする */
    }

    /* ---------- 趣味のリスト ---------- */
    .hobbies {
      list-style: none;                /* 標準の「・」マークを消す */
      margin: 0;                       /* 外側の余白をなくす */
      padding: 0;                      /* 内側の余白をなくす */
    }

    .hobbies li {
      padding: 12px 0 12px 18px;       /* 1項目ごとの内側の余白 */
      border-bottom: 1px solid #dbe7e2;/* 項目の下に細い区切り線 */
      position: relative;              /* 次の「■」マークの位置の基準にする */
    }

    .hobbies li::before {
      content: "";                     /* 中身は空で、四角い飾りだけを作る */
      position: absolute;              /* 位置を自由に決める */
      left: 0;                         /* 左端に置く */
      top: 1.2em;                      /* 上からの位置 */
      width: 8px;                      /* 四角の横幅 */
      height: 8px;                     /* 四角の高さ */
      background: var(--marker);       /* 黄色で塗る */
    }

    /* ---------- パソコンなど広い画面だけの調整 ---------- */
    @media (min-width: 700px) {
      /* 【ここは画面が広いときだけ有効】 パソコンでは少しゆったり表示します。 */
      .page { padding-top: 96px; }
      body { font-size: 18px; }
    }
  </style>
</head>

<body>
  <!-- 【ここから body】 実際に画面に表示される内容を書く場所です。 -->

  <main class="page">
    <!-- 【全体を包む箱】 中身をまとめて、真ん中に寄せています。 -->

    <div class="name-wrap">
      <h1 class="name">山田 花子</h1>
      <!-- ★★ ここを書き換えてください ★★ 【名前】 「山田 花子」の部分をあなたの名前に変えてください。 -->
    </div>

    <p class="greeting">
      はじめまして!私のページに来てくれてありがとうございます。気軽に見ていってください。
    </p>
    <!-- ★★ ここを書き換えてください ★★ 【ひとこと挨拶】 好きな言葉に変えてOKです。 -->

    <section>
      <!-- 【趣味のコーナー】 ここから趣味のまとまりです。 -->
      <h2>趣味</h2>
      <!-- 【見出し】 「趣味」という見出しです。 -->

      <ul class="hobbies">
        <!-- 【リストの始まり】 下の <li> 1つが、趣味1つ分です。 -->
        <li>散歩とカフェめぐり</li>
        <li>映画を観ること</li>
        <li>料理(最近はパン作りに挑戦中)</li>
        <li>旅行の計画を立てること</li>
        <li>音楽制作</li>
        <!-- ★★ ここを書き換えてください ★★
             趣味を増やしたいとき: <li>○○</li> の1行をコピーして、下に貼り付けて中の文字を変えます。
             減らしたいとき: <li>から</li>までの1行を丸ごと消します。 -->
      </ul>
    </section>

  </main>
</body>
</html>
